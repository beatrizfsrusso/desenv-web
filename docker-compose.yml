services:
  db:
    image: postgres:16
    container_name: fysikos-postgres
    environment:
      POSTGRES_DB: fysikos
      POSTGRES_USER: fysikos
      POSTGRES_PASSWORD: fysikos
    ports:
      - "5433:5432"
    volumes:
      - fysikos_pgdata:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/schema.sql

volumes:
  fysikos_pgdata:
